<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label Applicator — Solid / Wireframe</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; background: #0b0c0e; height: 100%; display: grid; place-items: center; }
  three-d-stage { display: block; width: 100vw; height: 100vh; }
  three-d-stage:not(:defined) { visibility: hidden; }
</style>
</head>
<body>
<three-d-stage name="label_applicator" background="#0b0c0e"></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
import { createEnv } from './bc-render-env.js';
const stage = document.querySelector('three-d-stage');
if (window.self !== window.top) { await stage.ready; stage._toolbar && (stage._toolbar.style.display = 'none'); }
const E = await createEnv(stage, { name: 'label_applicator' });
const { M, box, cyl, frustum, lathe, tube, group, robot, conveyor, fence, finish } = E;
conveyor('conveyor', { len: 3.4, width: 0.4, top: 0.85 });
[-1.4, -0.7, 0, 0.7, 1.4].forEach((x, i) => {
  box('case_' + i, 0.32, 0.24, 0.26, M.robot, x, 0.97, 0);
  if (x > -0.01) box('label_' + i, 0.16, 0.1, 0.004, M.alu, x, 0.98, -0.132);
});
box('stand_base', 0.7, 0.04, 0.7, M.dark, 0, 0.02, -0.95);
cyl('stand_column', 0.05, 1.6, M.alu, 0, 0.82, -0.95);
box('stand_collar', 0.14, 0.12, 0.14, M.gray, 0, 1.3, -0.95);
cyl('cross_arm', 0.035, 0.45, M.alu, 0, 1.3, -0.72, 'z');
box('mount_block', 0.12, 0.12, 0.08, M.gray, 0, 1.3, -0.5);
box('backplate', 0.75, 0.6, 0.04, M.robot, -0.05, 1.2, -0.44);
cyl('unwind_flange', 0.19, 0.01, M.alu, -0.2, 1.28, -0.41, 'z');
cyl('unwind_roll', 0.15, 0.05, M.robot, -0.2, 1.28, -0.38, 'z');
cyl('unwind_hub', 0.04, 0.08, M.alu, -0.2, 1.28, -0.38, 'z');
cyl('rewind_flange', 0.1, 0.01, M.alu, 0.2, 1.33, -0.41, 'z');
cyl('rewind_roll', 0.07, 0.05, M.gray, 0.2, 1.33, -0.38, 'z');
[[0.05, 1.08], [0.25, 1.04], [-0.05, 1.45]].forEach(([x, y], i) => cyl('guide_roller_' + i, 0.018, 0.07, M.alu, x, y, -0.38, 'z'));
box('peel_plate', 0.04, 0.14, 0.2, M.alu, 0.3, 0.98, -0.32);
cyl('drive_motor', 0.05, 0.14, M.gray, 0.2, 1.33, -0.53, 'z');
box('controller', 0.3, 0.35, 0.16, M.gray, -0.2, 1.2, -0.55);
box('sensor_bracket', 0.02, 0.1, 0.02, M.alu, -0.6, 0.9, -0.28);
box('product_sensor', 0.04, 0.04, 0.06, M.dark, -0.6, 0.96, -0.28);
finish({
  dims: [[[-1.7, 0.002, 0.25], [1.7, 0.002, 0.25], [0, 0, 0.45]], [[0.35, 0, -0.95], [0.35, 1.62, -0.95], [0.4, 0, 0]]],
  secondary: { y: 0.98, w: 1.7, d: 1.2 },
});
</script>
</body>
</html>
