<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capping Station — Solid / Wireframe</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; background: #0b0c0e; height: 100%; display: grid; place-items: center; }
  three-d-stage { display: block; width: 100vw; height: 100vh; }
  three-d-stage:not(:defined) { visibility: hidden; }
</style>
</head>
<body>
<three-d-stage name="capping_station" background="#0b0c0e"></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
import { createEnv } from './bc-render-env.js';
const stage = document.querySelector('three-d-stage');
if (window.self !== window.top) { await stage.ready; stage._toolbar && (stage._toolbar.style.display = 'none'); }
const E = await createEnv(stage, { name: 'capping_station' });
const { M, box, cyl, frustum, lathe, tube, group, robot, conveyor, fence, finish } = E;
conveyor('conveyor', { len: 4.2, width: 0.3, top: 0.9, legEvery: 1.0 });
box('guide_f', 4.0, 0.02, 0.02, M.alu, 0, 1.02, 0.056);
box('guide_b', 4.0, 0.02, 0.02, M.alu, 0, 1.02, -0.056);
const prof = [[0, 0], [0.04, 0], [0.045, 0.012], [0.045, 0.15], [0.04, 0.18], [0.018, 0.215], [0.017, 0.24], [0, 0.24]];
for (let i = 0; i < 29; i++) {
  const x = -1.68 + i * 0.12;
  lathe('bottle_' + i, prof, M.robot, x, 0.9, 0);
  if (x > -0.01) cyl('cap_' + i, 0.021, 0.028, M.dark, x, 1.154, 0);
}
box('capper_plinth', 1.32, 0.08, 0.52, M.dark, 0, 0.04, -0.6);
box('capper_base', 1.3, 0.72, 0.5, M.gray, 0, 0.44, -0.6);
box('column', 0.18, 1.5, 0.18, M.robot, 0, 1.55, -0.6);
box('arm', 0.22, 0.2, 0.75, M.robot, 0, 2.1, -0.3);
box('head_carriage', 0.26, 0.32, 0.26, M.robot, 0, 1.85, 0);
cyl('spindle_motor', 0.08, 0.3, M.gray, 0, 2.35, 0);
cyl('spindle', 0.025, 0.4, M.alu, 0, 1.49, 0);
frustum('chuck', 0.03, 0.045, 0.1, M.alu, 0, 1.22, 0);
box('hopper_post', 0.08, 1.46, 0.08, M.gray, -0.75, 1.53, -0.82);
box('hopper_bracket', 0.1, 0.06, 0.3, M.gray, -0.75, 2.2, -0.7);
frustum('cap_hopper', 0.32, 0.12, 0.38, M.gray, -0.75, 2.45, -0.6);
cyl('hopper_outlet', 0.04, 0.08, M.alu, -0.75, 2.22, -0.6);
tube('cap_chute', [[-0.75, 2.18, -0.6], [-0.5, 1.8, -0.28], [-0.18, 1.42, -0.03], [-0.05, 1.3, 0]], 0.022, M.alu);
box('guard_front', 1.5, 1.23, 0.01, M.poly, 0, 1.635, 0.35);
box('guard_left', 0.01, 1.23, 0.95, M.poly, -0.75, 1.635, -0.12);
box('guard_right', 0.01, 1.23, 0.95, M.poly, 0.75, 1.635, -0.12);
[[-0.75, 0.35], [0.75, 0.35], [-0.75, -0.6], [0.75, -0.6]].forEach(([x, z], i) => box('guard_post_' + i, 0.04, 1.23, 0.04, M.gray, x, 1.635, z));
box('guard_rail_front', 1.54, 0.04, 0.04, M.gray, 0, 2.25, 0.35);
box('guard_rail_l', 0.04, 0.04, 0.95, M.gray, -0.75, 2.25, -0.12);
box('guard_rail_r', 0.04, 0.04, 0.95, M.gray, 0.75, 2.25, -0.12);
finish({
  dims: [[[-2.1, 0.002, 0.2], [2.1, 0.002, 0.2], [0, 0, 0.55]], [[2.15, 0, 0.19], [2.15, 0.9, 0.19], [0, 0, 0.4]], [[0.78, 0, 0.35], [0.78, 2.5, 0.35], [0, 0, 0.45]]],
  secondary: { y: 0.9, w: 1.9, d: 1.0 },
});
</script>
</body>
</html>
