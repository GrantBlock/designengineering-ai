<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palletizer Retrofit — Solid / Wireframe</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; background: #0b0c0e; height: 100%; display: grid; place-items: center; }
  three-d-stage { display: block; width: 100vw; height: 100vh; }
  three-d-stage:not(:defined) { visibility: hidden; }
</style>
</head>
<body>
<three-d-stage name="palletizer_retrofit" background="#0b0c0e"></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
import { createEnv } from './bc-render-env.js';
const stage = document.querySelector('three-d-stage');
if (window.self !== window.top) { await stage.ready; stage._toolbar && (stage._toolbar.style.display = 'none'); }
const E = await createEnv(stage, { name: 'palletizer_retrofit' });
const { M, box, cyl, frustum, lathe, tube, group, robot, conveyor, fence, finish } = E;
box('floor_plate', 4.9, 0.06, 3.3, M.dark, 0, 0.03, -0.35);
box('robot_pedestal', 0.8, 0.7, 0.8, M.gray, 0, 0.41, -0.3);
box('pedestal_plate', 0.9, 0.03, 0.9, M.alu, 0, 0.775, -0.3);
robot('robot', 0, 0.79, -0.3, { rot: 0.35, scale: 1.35, a2: -0.3, a3: -2.0, a5: -0.85 });
const pallet = (nm, x, z, layers, partial) => {
  const g = group(nm, x, 0.06, z);
  [-0.45, 0, 0.45].forEach((zz, i) => box(nm + '_stringer_' + i, 1.2, 0.1, 0.1, M.gray, 0, 0.05, zz, g));
  for (let i = 0; i < 7; i++) box(nm + '_deck_' + i, 0.12, 0.02, 1.0, M.gray, -0.54 + i * 0.18, 0.11, 0, g);
  let k = 0;
  for (let L = 0; L < layers; L++) for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
    if (L === layers - 1 && partial && i * 3 + j >= partial) continue;
    box(nm + '_case_' + (k++), 0.37, 0.27, 0.31, M.robot, -0.38 + i * 0.38, 0.255 + L * 0.28, -0.32 + j * 0.32, g);
  }
};
pallet('pallet_a', -1.5, 0.5, 4, 0);
pallet('pallet_b', 1.5, 0.5, 2, 5);
conveyor('infeed', { len: 3.8, width: 0.45, top: 0.8, x: -1.3, z: -1.35, rollers: true });
[-2.7, -2.0, -1.3, -0.55].forEach((x, i) => box('infeed_case_' + i, 0.37, 0.27, 0.31, M.robot, x, 0.935, -1.35));
fence('fence', [[-2.4, 1.25], [-2.4, -1.95], [2.4, -1.95], [2.4, 1.25]]);
fence('fence_front', [[-0.7, 1.25], [0.7, 1.25]]);
[[-2.32, 1.25], [-0.78, 1.25], [0.78, 1.25], [2.32, 1.25]].forEach(([x, z], i) => {
  box('light_curtain_' + i, 0.05, 1.5, 0.06, M.alu, x, 0.85, z);
  box('light_curtain_' + i + '_cap', 0.06, 0.04, 0.07, M.dark, x, 1.62, z);
});
box('cabinet_plinth', 0.82, 0.1, 0.47, M.dark, -1.5, 0.05, -2.4);
box('control_cabinet', 0.8, 1.7, 0.45, M.gray, -1.5, 0.95, -2.4);
box('cabinet_door_seam', 0.004, 1.6, 0.004, M.dark, -1.5, 0.95, -2.174);
box('cabinet_handle_l', 0.02, 0.16, 0.03, M.alu, -1.56, 1.0, -2.16);
box('cabinet_handle_r', 0.02, 0.16, 0.03, M.alu, -1.44, 1.0, -2.16);
finish({
  dims: [[[-2.4, 0.002, 1.3], [2.4, 0.002, 1.3], [0, 0, 0.5]], [[2.45, 0.002, -1.95], [2.45, 0.002, 1.25], [0.5, 0, 0]], [[-2.1, 0.06, 1.0], [-2.1, 1.3, 1.0], [0, 0, 0.55]]],
  secondary: { y: 1.35, w: 2.4, d: 3.2 },
  envelope: { x: 0, z: -0.3, r: 2.0, y: 0.065 },
});
</script>
</body>
</html>
