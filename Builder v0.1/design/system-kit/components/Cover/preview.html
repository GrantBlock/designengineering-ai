<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design Engineering</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bc-canvas); color:var(--bc-ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .surface { fill:var(--bc-surface); }
  .raised { fill:var(--bc-surface-raised); }
  .steel { fill:var(--bc-steel-blue); }
  .field { fill:var(--bc-field); }
  .tint { fill:var(--bc-steel-blue-tint); }
  .shell { rx:var(--bc-radius-shell); }
  .comp { rx:var(--bc-radius-composer); }
  .panel { rx:var(--bc-radius-panel); }
  .card { rx:var(--bc-radius-card); }
  .words { position:absolute; left:var(--bc-space-8); bottom:var(--bc-space-8); max-width:440px; }
  .name { margin:0; font-size:64px; line-height:.95; font-weight:800; letter-spacing:-0.01em; color:var(--bc-ink); }
  .tag { margin:var(--bc-space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--bc-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      bc-surface 264 wide (bc-sidebar-width) bleeding off the bottom · bc-steel-blue 206×150 bled off top and right (the identity) · bc-field 64 tall (the composer island) bled right · bc-steel-blue-tint 96×64 — ≈40% of 960×288
  arrangement the shell: one tall panel slab with satellites to its right, separated by bc-shell-gap (10px), the way sidebar and main column sit
  pattern     tiles, from "geometric, modular, dense UI" — the Models grid: bc-surface-raised cards three across, 36 tall (bc-control-height), one merged two-wide beside a tint card
  scales      gaps bc-space-2 / bc-shell-gap; insets bc-space-4; corners bc-radius-shell, bc-radius-composer, bc-radius-panel, bc-radius-card
-->
<rect class="surface shell" x="0" y="24" width="264" height="300" rx="18"/>
<rect class="raised card" x="16" y="40" width="72" height="36" rx="12"/>
<rect class="raised card" x="96" y="40" width="72" height="36" rx="12"/>
<rect class="raised card" x="176" y="40" width="72" height="36" rx="12"/>
<rect class="raised card" x="16" y="84" width="72" height="36" rx="12"/>
<rect class="raised card" x="96" y="84" width="72" height="36" rx="12"/>
<rect class="raised card" x="176" y="84" width="72" height="36" rx="12"/>
<rect class="raised card" x="16" y="128" width="152" height="36" rx="12"/><rect class="tint card" x="176" y="128" width="72" height="36" rx="12"/>
<rect class="raised card" x="16" y="172" width="72" height="36" rx="12"/>
<rect class="raised card" x="96" y="172" width="72" height="36" rx="12"/>
<rect class="raised card" x="176" y="172" width="72" height="36" rx="12"/>
<rect class="raised card" x="16" y="216" width="72" height="36" rx="12"/>
<rect class="raised card" x="96" y="216" width="72" height="36" rx="12"/>
<rect class="raised card" x="176" y="216" width="72" height="36" rx="12"/>
<rect class="raised card" x="16" y="260" width="72" height="36" rx="12"/>
<rect class="raised card" x="96" y="260" width="72" height="36" rx="12"/>
<rect class="raised card" x="176" y="260" width="72" height="36" rx="12"/>
<rect class="steel comp" x="274" y="-20" width="226" height="150" rx="20"/>
<rect class="field comp" x="274" y="140" width="226" height="64" rx="20"/>
<rect class="tint panel" x="274" y="214" width="96" height="64" rx="16"/>
</svg>
</div>
<div class="words">
<h1 class="name">Design Engineering</h1>
<p class="tag">Automation design, from first sketch to FAT.</p>
</div>
</div>
</body>
</html>
